name: Daily cat

# Rebuilds the site once a day so a new permalink exists for the new day and
# index.html points at the new cat and build.py emits its social card. This
# NEVER reruns curation -- curate.py
# needs the cat-pictures source blocks, which are deliberately not in this repo.
# It only re-reads data/manifest.json and regenerates HTML.

on:
  schedule:
    # 00:05 UTC, five minutes after the day rolls over for the date maths.
    - cron: "5 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/build.py"
      - "data/**"
      - ".github/workflows/daily.yml"

# A scheduled run and a manual run must never interleave: both commit to the
# same branch, and a race would leave the repo with a half-written day.
concurrency:
  group: daily-cat-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level so the deploy step's `if:` can see it. A step cannot read its
    # own `env:` block from its `if:` -- the condition is evaluated first.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install static-card dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-comic-neue
          python -m pip install "pillow>=10,<13"

      - name: Rebuild the site (HTML and OG cards only -- no curation)
        run: python tools/build.py

      - name: Commit the new day
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed today."
          else
            git commit -m "Cat of the day: $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Only needed if you deploy with an API token. If you connected
      # Cloudflare Pages directly to this GitHub repo (the simpler route),
      # the push above already triggers the deploy and this step is skipped
      # automatically because the secret is absent.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cat-of-the-day
